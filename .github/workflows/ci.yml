name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Whole-workspace format check — no compile, so it covers the GPUI binary
      # too without needing the Metal Toolchain.
      - run: cargo fmt --all --check

  core:
    name: Core, local, CLI, FFI (clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # prmarmot-core, prmarmot-local, and prmarmot-cli have no GPUI/Metal
      # dependency, so they compile cleanly on Linux. The root GPUI binary is
      # intentionally not built in CI — see CLAUDE.md ("Fast core checks only");
      # build it locally with `make build`.
      - name: Clippy (core, local, cli, ffi; warnings as errors)
        run: cargo clippy -p prmarmot-core -p prmarmot-local -p prmarmot-cli -p prmarmot-ffi --all-targets -- -D warnings
      - name: Test (core spec + golden suite, local, cli, ffi)
        run: cargo test -p prmarmot-core -p prmarmot-local -p prmarmot-cli -p prmarmot-ffi
      # The iOS build compiles issue-link patterns with regex-lite. Run the
      # whole core suite under it so the two engines cannot disagree about
      # anything this project does.
      - name: Test core with the iOS regex engine
        run: cargo test -p prmarmot-core --no-default-features --features small-regex

  msrv:
    name: MSRV (core, local, CLI on Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in core/, local/, and cli/Cargo.toml.
      # The GPUI app needs a newer toolchain and is not part of this promise.
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.120
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # --locked: a dependency bump that raises the floor fails here first.
      # prmarmot-ffi is deliberately absent: it only ever builds for Apple
      # targets from a current Xcode toolchain, which is why uniffi and its
      # dependencies live there and not in core.
      - name: Check at the declared rust-version
        run: cargo check --locked -p prmarmot-core -p prmarmot-local -p prmarmot-cli --all-targets
