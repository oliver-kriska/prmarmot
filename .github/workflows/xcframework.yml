name: XCFramework

# Separate from release.yml on purpose: a desktop release must never wait on
# an Apple toolchain, and an FFI release must never touch the cask.
on:
  push:
    tags: ["ffi-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the assets to (leave empty to build only)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MODULE: PRMarmotCore

jobs:
  build:
    name: Build PRMarmotCore.xcframework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The bridge and the type conversions are ordinary Rust; failing here is
      # cheaper than failing after three cross-compiles.
      - name: Test the FFI crate
        run: cargo test -p prmarmot-ffi

      - name: Build the XCFramework
        run: scripts/build-xcframework.sh --zip

      - name: Smoke test in the iPad simulator
        working-directory: apple
        run: |
          xcodebuild test \
            -scheme PRMarmotCore \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            | xcbeautify || xcodebuild test \
            -scheme PRMarmotCore \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)'

      - name: Record what was built
        id: facts
        run: |
          CHECKSUM=$(cat target/xcframework/$MODULE.xcframework.zip.checksum)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          SIZE=$(stat -f%z target/xcframework/$MODULE.xcframework.zip)
          echo "zip_bytes=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "### $MODULE.xcframework"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| zip | $SIZE bytes |"
            echo "| checksum | \`$CHECKSUM\` |"
            echo "| device slice | $(stat -f%z target/aarch64-apple-ios/ios/libprmarmot_ffi.a) bytes (archive) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A consumer package that points at this release's asset. Written here
      # rather than committed, so its checksum can never be out of date.
      - name: Write the consumer Package.swift
        if: startsWith(github.ref, 'refs/tags/ffi-v') || inputs.tag != ''
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MODULE}.xcframework.zip"
          cat > target/xcframework/Package.swift <<EOF
          // swift-tools-version: 5.9
          //
          // Generated by .github/workflows/xcframework.yml for ${TAG}.
          // Do not edit: the checksum belongs to one specific asset.

          import PackageDescription

          let package = Package(
              name: "PRMarmotCore",
              platforms: [.iOS(.v17)],
              products: [
                  .library(name: "PRMarmotCore", targets: ["PRMarmotCore"])
              ],
              targets: [
                  .binaryTarget(
                      name: "prmarmot_ffiFFI",
                      url: "${URL}",
                      checksum: "${{ steps.facts.outputs.checksum }}"
                  ),
                  .target(name: "PRMarmotCore", dependencies: ["prmarmot_ffiFFI"]),
              ]
          )
          EOF
          cat target/xcframework/Package.swift

      # The generated Swift is part of the deliverable: the binary target is
      # only the C ABI, and the app needs these sources to call it.
      - name: Package the Swift sources
        run: |
          (cd target/xcframework && zip -qry PRMarmotCore-Sources.zip Sources)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PRMarmotCore-xcframework
          path: |
            target/xcframework/PRMarmotCore.xcframework.zip
            target/xcframework/PRMarmotCore.xcframework.zip.checksum
            target/xcframework/PRMarmotCore-Sources.zip
            target/xcframework/Package.swift
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/ffi-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "PRMarmotCore ${GITHUB_REF_NAME}" \
            --notes "XCFramework for PR Marmot for iPad.

          SwiftPM checksum: \`${{ steps.facts.outputs.checksum }}\`" \
            || true
          gh release upload "${GITHUB_REF_NAME}" \
            target/xcframework/PRMarmotCore.xcframework.zip \
            target/xcframework/PRMarmotCore.xcframework.zip.checksum \
            target/xcframework/PRMarmotCore-Sources.zip \
            target/xcframework/Package.swift \
            --clobber
