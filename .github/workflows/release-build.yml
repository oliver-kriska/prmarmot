name: Signed release candidate

# Manual, publish-nothing path. It exercises the real Developer ID,
# notarization, staple, Gatekeeper, and archive steps at an exact ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-candidate-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: Signed macOS arm64 candidate (no publish)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Require an Apple-silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify and build release binary
        run: |
          make verify
          cargo build --release --locked

      - name: Import Apple credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: scripts/import-apple-signing-ci.sh

      - name: Bundle, sign, notarize, staple, and verify
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          scripts/bundle-app.sh --stage-only
          scripts/sign-notarize-macos.sh target/bundle/prmarmot.app
          test "$(lipo -archs target/bundle/prmarmot.app/Contents/MacOS/prmarmot)" = arm64

      - name: Package candidate
        id: package
        run: |
          version=$(awk -F'"' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          test -n "$version"
          mkdir -p dist
          asset="prmarmot-v${version}-macos-arm64.tar.gz"
          COPYFILE_DISABLE=1 tar czf "dist/$asset" -C target/bundle prmarmot.app
          if tar tzf "dist/$asset" | grep -Eq '(^|/)\._'; then
            echo "AppleDouble metadata found in $asset" >&2
            exit 1
          fi
          (cd dist && shasum -a 256 "$asset" >"$asset.sha256")
          (cd dist && shasum -a 256 -c "$asset.sha256")
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Upload signed candidate (never a release)
        uses: actions/upload-artifact@v7
        with:
          name: prmarmot-v${{ steps.package.outputs.version }}-macos-arm64-signed-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Apple credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/prmarmot-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/prmarmot-signing.p12" "$RUNNER_TEMP/AuthKey.p8"
