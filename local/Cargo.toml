[package]
name = "prmarmot-local"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local config and attention state for PR Marmot, shared by the desktop app and the CLI"

[dependencies]
prmarmot-core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
