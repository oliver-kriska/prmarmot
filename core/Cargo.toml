[package]
name = "prmarmot-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Framework-independent core for PR Marmot: GitHub transport, categorization, note logic"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
chrono = "0.4"
