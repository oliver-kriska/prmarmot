[workspace]
members = ["core", "local", "cli", "ffi"]

[package]
name = "prmarmot"
version = "0.20.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "GitHub PR review dashboard — a native desktop app"
repository = "https://github.com/oliver-kriska/prmarmot"
homepage = "https://github.com/oliver-kriska/prmarmot"

[features]
# Frame-time measurement for performance work (src/perf.rs); never shipped.
perf = ["gpui/profiler"]

[dependencies]
# `http`: the update check asks GitHub directly when there is no `gh`.
prmarmot-core = { path = "core", features = ["http"] }
prmarmot-local = { path = "local", features = ["http"] }
# GPUI Fast (github.com/longbridge/gpui-fast): GPUI with retained views and
# scroll layers, which cut a scrolled frame from ~6.9 to ~2.4 ms of main-thread
# CPU. gpui-component's `gpui-fast` feature builds the components on it; the
# four pins move together. Render code that reads state outside entities and
# globals (the clock, an Rc<RefCell>) must notify the view that draws it.
gpui = { package = "gpui-fast", version = "=0.1.14" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.14", features = ["font-kit", "wayland", "x11"] }
gpui-component = { version = "=0.9.1", features = ["gpui-fast"] }
# Already used by gpui-component; expose its plain selectable-text primitive.
gpui-base = { version = "=0.9.1", features = ["gpui-fast"] }
chrono = "0.4"
# Config file (Spotlight launches have no env vars / cwd).
toml = "1.1"
# In-place config updates that preserve the user's comments/formatting.
toml_edit = "0.25"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A refresh's progress from the background fetch to the window (already in
# the tree through GPUI).
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# UNUserNotificationCenter, used directly for its droppable async response
# (notify-rust 4.18's macOS backend is this crate, but only offers a wait that
# blocks a thread until the person acts) and its typed authorization status.
mac-usernotifications = "=0.3.1"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSImage", "NSPasteboard", "NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSString"] }

# Desktop notifications elsewhere (freedesktop D-Bus).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "=4.18.2"

# No tokio, no reqwest — transport is a `gh` subprocess on GPUI's background executor.
# No `open` crate — gpui's cx.open_url covers open-in-browser.

# block 0.1.6 (via GPUI's macOS backend) declares a static of an uninhabited
# type, a future hard error in rustc. Upstream is unmaintained; see
# vendor/block/PATCHED.md.
[patch.crates-io]
block = { path = "vendor/block" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The iOS static library, built by `scripts/build-xcframework.sh`. A separate
# profile because the desktop app wants speed and this wants bytes: every
# megabyte here is a megabyte of App Store download and of the app's disk
# footprint on an iPad.
#
# `panic = "abort"` is the one with a consequence worth knowing: a Rust panic
# ends the app rather than surfacing to Swift as a thrown error. That is the
# trade the size makes; `ffi/README.md` says what to do if it ever bites.
[profile.ios]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
