[workspace]
members = ["core", "local", "cli", "ffi"]

[package]
name = "prmarmot"
version = "0.12.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "GitHub PR review dashboard — a native desktop app"
repository = "https://github.com/oliver-kriska/prmarmot"
homepage = "https://github.com/oliver-kriska/prmarmot"

[features]
# Frame-time measurement for performance work (src/perf.rs); never shipped.
perf = ["gpui/profiler"]

[dependencies]
# `http`: the update check asks GitHub directly when there is no `gh`.
prmarmot-core = { path = "core", features = ["http"] }
prmarmot-local = { path = "local", features = ["http"] }
# GPUI Kit 0.6 uses the published gpui-pre runtime and platform split.
gpui = { package = "gpui-pre", version = "=0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = ["font-kit", "wayland", "x11"] }
gpui-component = "=0.6.1"
# Already used by gpui-component; expose its plain selectable-text primitive.
gpui-base = "=0.6.1"
chrono = "0.4"
# Config file (Spotlight launches have no env vars / cwd).
toml = "1.1"
# In-place config updates that preserve the user's comments/formatting.
toml_edit = "0.25"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
# No tokio, no reqwest — transport is a `gh` subprocess on GPUI's background executor.
# No `open` crate — gpui's cx.open_url covers open-in-browser.

# block 0.1.6 (via GPUI's macOS backend) declares a static of an uninhabited
# type, a future hard error in rustc. Upstream is unmaintained; see
# vendor/block/PATCHED.md.
[patch.crates-io]
block = { path = "vendor/block" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The iOS static library, built by `scripts/build-xcframework.sh`. A separate
# profile because the desktop app wants speed and this wants bytes: every
# megabyte here is a megabyte of App Store download and of the app's disk
# footprint on an iPad.
#
# `panic = "abort"` is the one with a consequence worth knowing: a Rust panic
# ends the app rather than surfacing to Swift as a thrown error. That is the
# trade the size makes; `ffi/README.md` says what to do if it ever bites.
[profile.ios]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
