# git-cliff configuration — https://git-cliff.org
#
# Generates CHANGELOG.md and the "Unreleased" draft-release body from the git
# history. Conventional Commits (feat:/fix:/docs:/…) are grouped; unconventional
# commits are KEPT (grouped under "Other"), so PR Marmot's current direct-to-main
# history still shows up in the "what isn't released yet" view.
#
#   make changelog    # regenerate CHANGELOG.md (run when cutting a release)
#   make unreleased   # print what's on main but not in the latest tag

[changelog]
header = """
# Changelog

All notable changes to PR Marmot are recorded here. Generated by \
[git-cliff](https://git-cliff.org) from the commit history — do not edit by hand.
"""
# Tera template. `version` is unset for the Unreleased section. The leading blank
# line (with trim = false) separates each release block in the rendered file.
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{%- endfor %}
{% endfor %}"""
footer = ""
trim = false

[git]
conventional_commits = true
# Keep commits that aren't Conventional Commits (PR Marmot commits directly to
# main today) — they land in the "Other" group instead of being dropped.
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Only vX.Y.Z tags delimit releases.
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
# First match wins. The <!-- N --> prefixes force group ordering, then get
# stripped by `striptags` in the template above.
commit_parsers = [
  { message = "^Merge ", skip = true },
  # The release-bump commit itself is noise in the next cycle's changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
  # Dependabot (prefix "deps") -> "deps: bump …" / "deps(scope): …";
  # default GitHub style -> "Bump …".
  { message = "(?i)^deps", group = "<!-- 5 -->📦 Dependencies" },
  { message = "(?i)^(build|chore)\\(deps\\)", group = "<!-- 5 -->📦 Dependencies" },
  { message = "(?i)^bump ", group = "<!-- 5 -->📦 Dependencies" },
  { message = "^(chore|build|ci|style|test)", group = "<!-- 6 -->🧹 Chores" },
  { message = ".*", group = "<!-- 7 -->📝 Other" },
]
